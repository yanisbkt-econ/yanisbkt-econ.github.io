{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main">
        <button type="button" aria-label="More pages" aria-expanded="false" aria-controls="site-nav-more">
          <span class="navicon"></span>
        </button>
        <ul class="visible-links">
          <li class="masthead__menu-item">
            <a href="{{ base_path }}/" class="masthead__home{% if page.url == "/" %} active{% endif %}"{% if page.url == "/" %} aria-current="page"{% endif %}>{{ site.navbar_home_label }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item{% if link.pin %} masthead__menu-item--pin{% endif %}">
              <a href="{{ domain }}{{ link.url }}"
                 {% if page.url == link.url %}class="active" aria-current="page"{% endif %}
                 {% if link.url contains 'http' %}target="_blank" rel="noopener noreferrer"{% endif %}>
                {{ link.title }}
              </a>
            </li>
          {% endfor %}
        </ul>
        <ul id="site-nav-more" class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
