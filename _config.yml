locale                   : "en-GB"
title                    : "Yanis Bekhti"
title_separator          : "-"
description              : "I am a fourth-year Ph.D. candidate in Economics, enrolled in a joint program between the Catholic University of Milan in Italy and Paris 1 Panthéon-Sorbonne University in France. My research mostly focuses on applied macroeconomic development, studying the extent to which structural change and manufacturing remain engines of long-term growth."
url                   : https://yanisbkt-econ.github.io
baseurl                  : ""
navbar_home_label        : "Home"
port                     : 4001

author:
  avatar           : "profile-avatar.jpg"
  name             : "Yanis Bekhti"
  bio              : "Ph.D. Candidate in Economics"
  email            : "yanis.bekhti@univ-paris1.fr"
  email_label      : "Email 1"
  email2           : "yanis.bekhti@unicatt.it"
  email2_label     : "Email 2"
  orcid            :
